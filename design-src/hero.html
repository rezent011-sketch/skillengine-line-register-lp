<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>hero</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .stage {
      background: #07102e;
    }
    .vignette {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 55% at 50% 42%, rgba(10,20,60,.15) 0%, rgba(4,8,28,.55) 100%);
      pointer-events: none;
    }
    .banner {
      position: absolute;
      left: 50%;
      top: 72px;
      transform: translateX(-50%);
      width: 820px;
      height: 92px;
      background: linear-gradient(180deg, #243056 0%, #151a3a 100%);
      clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%);
      box-shadow: 0 10px 28px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    .banner span {
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 900;
      font-size: 40px;
      color: #fff;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 6px rgba(0,0,0,.5);
    }
    .medal {
      position: absolute;
      left: 50%;
      top: 196px;
      transform: translateX(-50%);
      width: 360px;
      height: 360px;
      z-index: 5;
    }
    .medal .disc {
      position: absolute;
      inset: 18px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 35% 28%, #fff8d0 0%, #ffe27a 28%, #eab308 58%, #b8860b 82%, #8a5a00 100%);
      box-shadow:
        0 0 0 8px #7a4b00,
        0 0 0 16px #f6d36a,
        0 0 0 22px #8d5a00,
        0 16px 36px rgba(0,0,0,.5),
        0 0 40px rgba(234,179,8,.45);
    }
    .medal .disc::before {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 50%;
      border: 3px dashed rgba(122,75,0,.55);
    }
    .medal .star {
      position: absolute;
      left: 50%;
      top: 58px;
      transform: translateX(-50%);
      color: #7a3a00;
      font-size: 42px;
      text-shadow: 0 2px 0 #fff2c2;
      z-index: 2;
    }
    .medal .txt {
      position: absolute;
      left: 40px;
      right: 40px;
      top: 118px;
      text-align: center;
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 900;
      font-size: 42px;
      line-height: 1.25;
      color: #5a2a00;
      letter-spacing: 0.04em;
      z-index: 2;
    }
    .title {
      position: absolute;
      left: 0;
      right: 0;
      top: 580px;
      height: 200px;
      z-index: 6;
    }
    .title .gold3d {
      font-size: 118px;
      height: 200px;
    }
    .ribbon-wrap {
      position: absolute;
      left: 50%;
      top: 800px;
      transform: translateX(-50%);
      width: 900px;
      height: 150px;
      z-index: 7;
    }
    .ribbon {
      position: absolute;
      left: 40px;
      right: 40px;
      top: 28px;
      height: 96px;
      background: linear-gradient(180deg, #ff4d4d 0%, #dc2626 42%, #b91c1c 100%);
      border-radius: 8px;
      box-shadow: 0 12px 24px rgba(0,0,0,.4), inset 0 2px 0 rgba(255,255,255,.35);
      border-top: 4px solid #f6d36a;
      border-bottom: 4px solid #f6d36a;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .ribbon::before,
    .ribbon::after {
      content: "";
      position: absolute;
      top: 10px;
      width: 36px;
      height: 120px;
      background: linear-gradient(180deg, #ef4444, #991b1b);
      z-index: -1;
    }
    .ribbon::before { left: -28px; transform: skewY(-28deg); }
    .ribbon::after { right: -28px; transform: skewY(28deg); }
    .ribbon span {
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 900;
      font-size: 52px;
      color: #fff;
      letter-spacing: 0.12em;
      text-shadow: 0 3px 6px rgba(0,0,0,.4);
    }
    .wreaths {
      position: absolute;
      left: 70px;
      right: 70px;
      top: 1000px;
      display: flex;
      flex-direction: column;
      gap: 36px;
      z-index: 6;
    }
    .wreath {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      height: 220px;
    }
    .wreath svg {
      width: 200px;
      height: 200px;
      filter: drop-shadow(0 8px 14px rgba(0,0,0,.45));
      flex-shrink: 0;
    }
    .wreath .lab {
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 900;
      font-size: 48px;
      color: #ffe27a;
      letter-spacing: 0.06em;
      text-shadow: 0 2px 0 #7a4b00, 0 4px 10px rgba(0,0,0,.6), 0 0 16px rgba(234,179,8,.4);
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="bg/hero-bg.png" alt="" />
    <div class="vignette"></div>

    <div class="banner"><span>未経験でも稼げる環境</span></div>

    <div class="medal">
      <div class="disc"></div>
      <div class="star">★</div>
      <div class="txt">稼がせる<br>ことに特化</div>
    </div>

    <div class="title">
      <div class="gold3d">
        <div class="layer shadow">スキルエンジン</div>
        <div class="layer stroke">スキルエンジン</div>
        <div class="layer stroke2">スキルエンジン</div>
        <div class="layer fill">スキルエンジン</div>
        <div class="layer gloss">スキルエンジン</div>
      </div>
    </div>

    <div class="ribbon-wrap">
      <div class="ribbon"><span>月2回 一対一</span></div>
    </div>

    <svg width="0" height="0" aria-hidden="true" style="position:absolute">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff3b0"/>
          <stop offset="45%" stop-color="#eab308"/>
          <stop offset="100%" stop-color="#a16207"/>
        </linearGradient>
        <g id="wreath-shape">
          <g fill="url(#g1)" stroke="#7a4b00" stroke-width="1.2">
            <ellipse cx="62" cy="46" rx="16" ry="10" transform="rotate(-55 62 46)"/>
            <ellipse cx="48" cy="72" rx="17" ry="10" transform="rotate(-40 48 72)"/>
            <ellipse cx="40" cy="100" rx="18" ry="11" transform="rotate(-20 40 100)"/>
            <ellipse cx="46" cy="128" rx="17" ry="10" transform="rotate(5 46 128)"/>
            <ellipse cx="62" cy="152" rx="16" ry="10" transform="rotate(25 62 152)"/>
            <ellipse cx="80" cy="170" rx="15" ry="9" transform="rotate(45 80 170)"/>
            <ellipse cx="138" cy="46" rx="16" ry="10" transform="rotate(55 138 46)"/>
            <ellipse cx="152" cy="72" rx="17" ry="10" transform="rotate(40 152 72)"/>
            <ellipse cx="160" cy="100" rx="18" ry="11" transform="rotate(20 160 100)"/>
            <ellipse cx="154" cy="128" rx="17" ry="10" transform="rotate(-5 154 128)"/>
            <ellipse cx="138" cy="152" rx="16" ry="10" transform="rotate(-25 138 152)"/>
            <ellipse cx="120" cy="170" rx="15" ry="9" transform="rotate(-45 120 170)"/>
          </g>
          <path d="M100 42 C72 70 58 110 70 168" fill="none" stroke="#a16207" stroke-width="5"/>
          <path d="M100 42 C128 70 142 110 130 168" fill="none" stroke="#a16207" stroke-width="5"/>
          <polygon points="100,18 108,40 132,40 112,54 120,76 100,62 80,76 88,54 68,40 92,40" fill="#fff3b0" stroke="#a16207" stroke-width="2"/>
        </g>
      </defs>
    </svg>

    <div class="wreaths">
      <div class="wreath">
        <svg viewBox="0 0 200 200" aria-hidden="true"><use href="#wreath-shape"/></svg>
        <div class="lab">個別コンサル</div>
      </div>
      <div class="wreath">
        <svg viewBox="0 0 200 200" aria-hidden="true"><use href="#wreath-shape"/></svg>
        <div class="lab">楽稼ぎスキーム</div>
      </div>
      <div class="wreath">
        <svg viewBox="0 0 200 200" aria-hidden="true"><use href="#wreath-shape"/></svg>
        <div class="lab">スキル0でも</div>
      </div>
    </div>
  </div>
</body>
</html>
