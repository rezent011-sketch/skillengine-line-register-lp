<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>value-earn</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .stage { background: #b8e4ff; }
    .card {
      position: absolute;
      left: 70px;
      right: 70px;
      top: 160px;
      bottom: 160px;
      background: #fff;
      border-radius: 36px;
      border: 8px solid #eab308;
      box-shadow: 0 18px 40px rgba(15,40,80,.18), inset 0 0 0 3px #fde68a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 44px;
    }
    .icon { width: 200px; height: 200px; margin-bottom: 28px; }
    .badge {
      background: #1e1b4b;
      color: #fff;
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 900;
      font-size: 32px;
      letter-spacing: 0.04em;
      padding: 14px 28px;
      border-radius: 16px;
      margin-bottom: 40px;
      text-align: center;
    }
    .head {
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 900;
      font-size: 64px;
      color: #dc2626;
      text-align: center;
      line-height: 1.25;
      letter-spacing: 0.02em;
      margin-bottom: 32px;
    }
    .sub {
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 900;
      font-size: 40px;
      color: #1e293b;
      text-align: center;
      line-height: 1.5;
    }
    .note {
      margin-top: 36px;
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 700;
      font-size: 30px;
      color: #334155;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="bg/water-bg.png" alt="" />
    <div class="card">
      <svg class="icon" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="86" fill="#eff6ff" stroke="#2563eb" stroke-width="6"/>
        <path d="M112 36 L58 108 H96 L84 164 L148 86 H108 Z" fill="#2563eb"/>
      </svg>
      <div class="badge">AIの使い方だけではない</div>
      <div class="head">稼がせることに<br>特化</div>
      <div class="sub">楽稼ぎスキームを<br>複数用意</div>
      <div class="note">使い方だけ教えて終わらせない。<br>稼ぐ側に寄せた環境です。</div>
    </div>
  </div>
</body>
</html>
