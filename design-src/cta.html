<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>cta</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .stage { background: #dbeafe; }
    .inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 48px;
    }
    .red {
      background: linear-gradient(180deg, #ef4444, #dc2626);
      color: #fff;
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 900;
      font-size: 44px;
      letter-spacing: 0.1em;
      padding: 18px 48px;
      border-radius: 16px;
      border: 3px solid #fff;
      box-shadow: 0 10px 24px rgba(220,38,38,.35);
      margin-bottom: 72px;
    }
    .pill {
      width: 900px;
      height: 240px;
      border-radius: 999px;
      background: radial-gradient(ellipse at 50% 35%, #4ade80 0%, #22c55e 42%, #16a34a 100%);
      box-shadow:
        0 0 0 8px #fff,
        0 0 0 14px rgba(255,255,255,.7),
        0 18px 36px rgba(22,163,74,.4),
        0 0 40px rgba(34,197,94,.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .pill::after {
      content: "";
      position: absolute;
      left: 40px;
      right: 40px;
      top: 16px;
      height: 36px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0));
    }
    .pill .main {
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 900;
      font-size: 64px;
      color: #fff;
      letter-spacing: 0.06em;
      text-shadow: 0 3px 8px rgba(0,0,0,.25);
      position: relative;
      z-index: 1;
    }
    .pill .sub {
      margin-top: 14px;
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 700;
      font-size: 30px;
      color: #fff;
      letter-spacing: 0.12em;
      position: relative;
      z-index: 1;
    }
    .hint {
      margin-top: 64px;
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 900;
      font-size: 36px;
      color: #1e1b4b;
      text-align: center;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="bg/cta-bg.png" alt="" />
    <div class="inner">
      <div class="red">LINEに登録する</div>
      <div class="pill">
        <div class="main">LINE登録はこちら</div>
        <div class="sub">— 無料で環境を見る —</div>
      </div>
      <p class="hint">月2回の一対一コンサルと<br>稼がせることに特化した環境を、<br>まずは無料で確認</p>
    </div>
  </div>
</body>
</html>
