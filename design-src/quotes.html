<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>quotes</title>
  <link rel="stylesheet" href="shared.css" />
  <style>
    .stage { background: #d7eeff; }
    .stack {
      position: absolute;
      left: 56px;
      right: 56px;
      top: 90px;
      bottom: 150px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    .qcard {
      flex: 1;
      background: #fff;
      border-radius: 28px;
      border: 6px solid #eab308;
      box-shadow: 0 14px 32px rgba(15,40,80,.12);
      position: relative;
      padding: 56px 48px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .qcard .star {
      position: absolute;
      color: #eab308;
      font-size: 28px;
    }
    .qcard .tl { top: 18px; left: 22px; }
    .qcard .tr { top: 18px; right: 22px; }
    .qcard .bl { bottom: 18px; left: 22px; }
    .qcard .br { bottom: 18px; right: 22px; }
    .real {
      font-family: "Dela Gothic One", "Noto Sans JP", sans-serif;
      color: #ca8a04;
      font-size: 36px;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .flourish {
      width: 80px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #eab308, transparent);
      margin-bottom: 28px;
    }
    .burst {
      color: #eab308;
      font-size: 36px;
      margin-bottom: 18px;
    }
    .body {
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 900;
      font-size: 40px;
      color: #1e1b4b;
      text-align: center;
      line-height: 1.55;
    }
    .name {
      margin-top: 22px;
      font-family: "Dela Gothic One", "Noto Sans JP", sans-serif;
      font-size: 52px;
      background: linear-gradient(180deg, #fff3b0, #eab308 50%, #a16207);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 2px 0 #7a4b00);
    }
    .foot {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 110px;
      background: #1e1b4b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }
    .foot .line {
      width: 90px;
      height: 2px;
      background: #eab308;
    }
    .foot .lab {
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 900;
      font-size: 36px;
      color: #fff;
      letter-spacing: 0.12em;
    }
    .foot .star { color: #eab308; font-size: 22px; }
  </style>
</head>
<body>
  <div class="stage">
    <img class="bg" src="bg/sky-bg.png" alt="" />
    <div class="stack">
      <article class="qcard">
        <span class="star tl">✦</span><span class="star tr">✦</span>
        <span class="star bl">✦</span><span class="star br">✦</span>
        <div class="real">Real Story</div>
        <div class="flourish"></div>
        <p class="body">実はこの人たち…<br>全員SNS副業<br>初心者だったんです</p>
      </article>
      <article class="qcard">
        <span class="star tl">✦</span><span class="star tr">✦</span>
        <span class="star bl">✦</span><span class="star br">✦</span>
        <div class="burst">✸</div>
        <p class="body">スキルゼロ、経験ゼロ、<br>時間もない。<br>そんな人たちでも<br>成果が出てしまうのが</p>
        <div class="name">スキルエンジン</div>
      </article>
    </div>
    <div class="foot">
      <span class="star">★</span>
      <span class="line"></span>
      <span class="lab">スキルエンジン</span>
      <span class="line"></span>
      <span class="star">★</span>
    </div>
  </div>
</body>
</html>
